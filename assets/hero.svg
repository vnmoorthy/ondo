<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Ondo 温度: the AI that makes heat safe for every body</title>
  <desc id="d">A black canvas with a warm ember sunrise glowing along the horizon. Soft steam rises from the water, and a thin ember temperature arc from 35° to 43° frames the ONDO wordmark, with its marker at 37.5°C, the gentle Jade bath.</desc>
